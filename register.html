<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriLink - Register</title>
    <!-- LINK TO CSS FILE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> AgriLink:  Website</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="register.html">Register</a> | 
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="text-align: center;">Registration Form</h2>
        
        <form>
            <div class="form-group">
                <label>Register As:</label>
                <select>
                    <option value="producer">Producer (Farmer / Seller)</option>
                    <option value="consumer">Consumer (Buyer)</option>
                </select>
            </div>

            <div class="form-group">
                <label>First Name:</label>
                <input type="text" placeholder="e.g. Juan Dela Cruz" required>
            </div>
            
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" placeholder="e.g. Juan Dela Cruz" required>
            </div>

            <div class="form-group">
                <label>Farm / Business Name:</label>
                <input type="text" placeholder="e.g. Dela Cruz Farm">
            </div>

            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" placeholder="juan@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" required>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 AgriLink - ICCT Colleges Web Project</p>
    </footer>

</body>
</html>
